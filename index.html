<script>'use strict';
/* ================= CORE / WORLD GEN ================= */
const TAU=Math.PI*2,PI=Math.PI,abs=Math.abs,floor=Math.floor,sqrt=Math.sqrt,sin=Math.sin,cos=Math.cos,hyp=Math.hypot;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const damp=(a,b,l,dt)=>a+(b-a)*(1-Math.exp(-l*dt));
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hstr=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
const PERM=new Uint8Array(512),GX=new Float32Array(256),GZ=new Float32Array(256);
(function(){const r=rng(1337),p=[];for(let i=0;i<256;i++)p.push(i);for(let i=255;i>0;i--){const j=(r()*(i+1))|0,t=p[i];p[i]=p[j];p[j]=t}for(let i=0;i<512;i++)PERM[i]=p[i&255];for(let i=0;i<256;i++){const a=r()*TAU;GX[i]=cos(a);GZ[i]=sin(a)}})();
function noise2(x,y){const xi=floor(x),yi=floor(y),xf=x-xi,yf=y-yi,X=xi&255,Y=yi&255;
 const u=xf*xf*xf*(xf*(xf*6-15)+10),v=yf*yf*yf*(yf*(yf*6-15)+10);
 const a=PERM[X]+Y,b=PERM[X+1]+Y,g00=PERM[a],g10=PERM[b],g01=PERM[a+1],g11=PERM[b+1];
 const n00=GX[g00]*xf+GZ[g00]*yf,n10=GX[g10]*(xf-1)+GZ[g10]*yf,n01=GX[g01]*xf+GZ[g01]*(yf-1),n11=GX[g11]*(xf-1)+GZ[g11]*(yf-1);
 const x0=n00+(n10-n00)*u,x1=n01+(n11-n01)*u;return(x0+(x1-x0)*v)*1.41}
function fbm(x,z,o){let s=0,a=1,t=0;for(let i=0;i<o;i++){s+=noise2(x,z)*a;t+=a;x=x*2.03+17.1;z=z*2.03-9.3;a*=.5}return s/t}
const IS_MOBILE=typeof navigator!=='undefined'&&(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&typeof matchMedia!=='undefined'&&matchMedia('(pointer:coarse)').matches));

/* ---- regions: 0 Heartmeadow 1 Amberwood 2 Saltmarch coast 3 Cinderreach mesas 4 Frostpeak ---- */
const SEA=0,ANCH=[[0,260,520],[-680,-120,470],[-140,900,430],[780,180,470],[60,-800,560]];
const RNAME=['Heartmeadow','Amberwood','Saltmarch Coast','Cinderreach Mesas','Frostpeak Range'];
const RW=new Float64Array(5);
function regionW(x,z){let s=0;for(let i=0;i<5;i++){const a=ANCH[i],d=hyp(x-a[0],z-a[1])/a[2],w=Math.exp(-d*d*1.7);RW[i]=w;s+=w}s=s||1;for(let i=0;i<5;i++)RW[i]/=s}
const LAKES=[{x:-610,z:-210,r:100},{x:-830,z:40,r:75},{x:-540,z:20,r:55}],PADS=[];
let WY=0;
function raw(x,z){
 const wx=x+140*noise2(x*.0016,z*.0016),wz=z+140*noise2(x*.0016+9,z*.0016+4);
 const d=hyp(wx/1300,wz/1240),L=1-d+.2*noise2(wx*.0011+3,wz*.0011+7)+.06*noise2(wx*.005,wz*.005);
 regionW(wx,wz);
 const n1=fbm(x*.0042,z*.0042,4),rg=1-abs(noise2(x*.0026+5,z*.0026-3)),rg2=rg*rg;
 const t=fbm(x*.0028+11,z*.0028+2,3)*.5+.5,st=t*5,fl=floor(st),terr=fl+sstep(.25,.75,st-fl);
 const H=RW[0]*(10+9*n1)+RW[1]*(17+15*n1+6*rg2)+RW[2]*(7+6*n1)+RW[3]*(26+11*terr+6*n1)+RW[4]*(70+250*rg2+25*n1);
 const cw=lerp(.2,.045,sstep(.35,.75,noise2(wx*.003+20,wz*.003)*.5+.5)),prof=sstep(-.05,cw,L);
 const base=lerp(-34,H,prof);
 let det=(.9*noise2(x*.05,z*.05)+.3*noise2(x*.16,z*.16)+2.2*noise2(x*.014,z*.014))*(.4+.6*prof)*(1+RW[4]*2.2+RW[3]*.4);
 let h=base;WY=SEA;
 const rn=noise2(wx*.0021+3.3,wz*.0021-7.7)+.3*noise2(wx*.006,wz*.006),a=abs(rn),allow=sstep(46,22,base)*sstep(1.5,5,base);
 if(allow>0&&a<.06){const m=(1-sstep(0,.06,a))*allow,c=(1-sstep(0,.03,a))*allow;det*=1-.85*m;h=base+det-1.2*m;h=lerp(h,base-2.4,c);if(c>.01)WY=base-.6;}else h=base+det;
 return h}
