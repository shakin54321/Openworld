<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lantern Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: full-bleed game canvas; loading screen is an arched portrait beside the title block. Single dark cinematic look on purpose. */
:root{
  --ink:#0a0e12; --ink2:#111820; --panel:rgba(14,20,26,.82); --line:rgba(226,204,160,.22);
  --fg:#ece6d8; --dim:#9aa4a6; --gold:#dcb46a; --gold2:#f3d79a; --teal:#5fb8aa; --red:#d86a5a; --green:#8fcf7a; --blue:#78a8e0;
  --disp:'Marcellus','Cormorant Garamond',Georgia,serif; --ui:'Hanken Grotesk','Segoe UI',system-ui,sans-serif; --num:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;padding-inline:0}
body{background:var(--ink);color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b1118;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

/* ---------- loading screen ---------- */
#load{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 30% 40%,#16222b 0%,#0b1116 55%,#070a0d 100%);display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,72px);padding:clamp(16px,3vw,40px) 16px;box-sizing:border-box;transition:opacity 1.1s ease,visibility 1.1s;overflow:hidden}
#load.out{opacity:0;visibility:hidden}
#load .art{position:relative;height:min(86vh,720px);aspect-ratio:400/520;max-width:46vw;flex:0 1 auto;border-radius:999px 999px 14px 14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 0 9px rgba(10,14,18,.9),0 0 0 10px rgba(226,204,160,.18),0 40px 90px rgba(0,0,0,.65);background:#0d1a22}
#load .art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#load .art::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 40%,transparent 55%,rgba(4,7,10,.55) 100%);pointer-events:none}
#load .txt{min-width:0;flex:0 1 460px;display:flex;flex-direction:column;gap:18px}
#load .eyebrow{font-family:var(--num);font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:13px;color:var(--gold)}
#load h1{font-family:var(--disp);font-weight:400;font-size:clamp(44px,7.4vw,92px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance;color:var(--fg);text-shadow:0 2px 30px rgba(220,180,106,.18)}
#load h1 span{display:block;color:var(--gold2)}
#load .tag{margin:0;color:var(--dim);line-height:1.55;max-width:40ch;font-size:16px}
#load .bar{position:relative;height:3px;background:rgba(236,230,216,.12);border-radius:3px;overflow:hidden;margin-top:6px}
#load .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 14px rgba(243,215,154,.6);transition:width .25s ease-out}
#load .stat{display:flex;justify-content:space-between;gap:12px;font-family:var(--num);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--dim)}
#load .stat b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
#load .tip{min-height:2.9em;color:#7f8b8e;font-size:13.5px;line-height:1.45;max-width:46ch}
#begin{align-self:flex-start;pointer-events:auto;cursor:pointer;background:transparent;color:var(--gold2);border:1px solid var(--gold);padding:14px 38px;font-family:var(--disp);font-size:20px;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;transition:background .25s,color .25s,box-shadow .25s;display:none}
#begin:hover{background:var(--gold);color:#12100a;box-shadow:0 0 30px rgba(220,180,106,.45)}
#load.ready #begin{display:block;animation:rise .8s ease both}
#load.ready .bar,#load.ready .stat{opacity:.45}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#load .keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:#7b878a}
#load .keys kbd{font-family:var(--num);font-weight:600;letter-spacing:.06em;color:var(--fg);border:1px solid rgba(236,230,216,.25);border-radius:3px;padding:1px 6px;font-size:12.5px;margin-right:4px}
@media (max-width:760px){
  #load{flex-direction:column;justify-content:flex-start;gap:16px;padding-top:max(14px,env(safe-area-inset-top,0px));overflow:auto}
  #load .art{height:auto;width:min(58vw,300px);max-width:none;flex:none}
  #load .txt{flex:none;width:100%;max-width:520px;gap:12px}
  #load h1{font-size:clamp(40px,13vw,64px)}
  #load .keys{display:none}
}
@media (max-height:520px) and (min-width:761px){#load .keys{display:none}#load h1{font-size:clamp(36px,9vh,64px)}}

/* portrait animation (CSS-driven, layered) */
#load .plx{will-change:transform;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.breath{animation:breath 4.6s ease-in-out infinite;transform-origin:200px 430px}
@keyframes breath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.006)}}
.headtilt{animation:headtilt 9s ease-in-out infinite;transform-origin:200px 330px}
@keyframes headtilt{0%,100%{transform:rotate(-.6deg) translateY(0)}35%{transform:rotate(1.1deg) translateY(-1.5px)}70%{transform:rotate(-1.4deg) translateY(.5px)}}
.blink{transform-box:fill-box;transform-origin:50% 40%;animation:blink 5.2s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}93.5%{transform:scaleY(.06)}96%{transform:scaleY(1)}}
.iris{animation:glance 11s ease-in-out infinite}
@keyframes glance{0%,18%,100%{transform:translate(0,0)}24%,42%{transform:translate(3.5px,-.6px)}50%,64%{transform:translate(-2.5px,.8px)}72%{transform:translate(0,0)}}
.brow{animation:brow 7.5s ease-in-out infinite}
@keyframes brow{0%,60%,100%{transform:translateY(0)}66%,74%{transform:translateY(-2.2px)}}
.braid{animation:braid 6.2s ease-in-out infinite;transform-origin:252px 262px}
@keyframes braid{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(2.8deg)}}
.wisp{animation:wisp 4.2s ease-in-out infinite;transform-origin:var(--ox) var(--oy)}
@keyframes wisp{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
.tail{animation:tail 3.6s ease-in-out infinite;transform-origin:170px 372px}
@keyframes tail{0%,100%{transform:rotate(3deg) skewX(0)}50%{transform:rotate(-5deg) skewX(-3deg)}}
.pend{animation:pend 5s ease-in-out infinite;transform-origin:200px 352px}
@keyframes pend{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.glow{animation:glow 3.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.needle{animation:needle 7s ease-in-out infinite;transform-origin:200px 420px}
@keyframes needle{0%,100%{transform:rotate(-24deg)}20%{transform:rotate(32deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-40deg)}85%{transform:rotate(-12deg)}}
.mist{animation:mist 40s linear infinite}
.mist.b{animation-duration:62s;animation-direction:reverse}
@keyframes mist{from{transform:translateX(-80px)}to{transform:translateX(80px)}}
.twink{animation:twink 2.8s ease-in-out infinite}
@keyframes twink{0%,100%{opacity:.25}50%{opacity:1}}
.ember{animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.95}100%{transform:translate(var(--dx),-330px) scale(.15);opacity:0}}
.sunhalo{animation:halo 8s ease-in-out infinite;transform-origin:200px 170px}
@keyframes halo{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
body.touch #load .keys{display:none}
@media (prefers-reduced-motion:reduce){#load *{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>

let H, WL, REG, CTRL, FLOW, NRM;
const SITES = {};
const REGN = [
  { id: 'vale', name: 'Sunhollow Vale', x: -200, z: 360, r: 640 },
  { id: 'reach', name: 'Gilded Reach', x: 740, z: 120, r: 660 },
  { id: 'peaks', name: 'Ashfang Range', x: -60, z: -800, r: 780 },
  { id: 'mire', name: 'Mirewood', x: -840, z: -90, r: 500 },

async function generateWorld(progress) {
